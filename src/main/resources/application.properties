# ==========================================================
# Application
# ==========================================================
spring.application.name=expense-tracker

# ==========================================================
# MySQL Database Configuration
# ==========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@123}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# File Upload
# ==========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================================
# Upload Directory
# ==========================================================

file.upload-dir=uploads

# ==========================================================
# Server
# ==========================================================

server.port=${PORT:8080}
JWT_SECRET=mysecretkeymysecretkeymysecretkey123456

# ==========================================================
# Swagger
# ==========================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==========================================================
# Logging
# ==========================================================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
